[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-trader"
version = "0.1.0"
description = "AI-assisted quant research and guarded trading desk for Claude Code (Binance Spot)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "PyYAML>=6",
    "websockets>=14",
    "joblib>=1.4",
    "cryptography>=43",  # Ed25519 request signing; already pinned in requirements.lock
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "pandas-stubs"]

[project.scripts]
trader = "trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test needs internet access (deselected by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF007", "RUF012", "RUF028", "RUF059", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
files = ["src/trader"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
